# Render STLs

on:
  push:
    paths:
      - 'designs/*.scad'
      - 'lib/**'
      - template.scad
      - render.sh
      - Makefile
      - .github/workflows/render.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Build all STLs
        run: make all

      - name: Upload STL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stls
          path: stl/